<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090c">
<title>Численность</title>
<style>
  :root{
    --bg-0:#08090c;
    --bg-1:#101218;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.10);
    --glass-border:rgba(255,255,255,0.13);
    --hairline:rgba(255,255,255,0.08);
    --text-hi:rgba(255,255,255,0.95);
    --text-mid:rgba(255,255,255,0.62);
    --text-lo:rgba(255,255,255,0.36);
    --accent:#0A84FF;
    --accent-2:#5AC8FA;
    --danger:#FF5449;
    --warn:#FFB13D;
    --ok:#32D74B;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
    color:var(--text-hi);
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(70,110,255,0.18), transparent 55%),
      radial-gradient(900px 600px at 110% 10%, rgba(255,90,140,0.10), transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
    min-height:100vh;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 110px);
    min-height:100vh;
  }

  /* ---------- Top bar / floor tabs ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    padding:10px 2px 14px;
    margin:-14px -14px 14px;
    padding-left:14px; padding-right:14px;
    padding-top:calc(env(safe-area-inset-top) + 14px);
    background:linear-gradient(180deg, rgba(8,9,12,0.92), rgba(8,9,12,0.75) 70%, transparent);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
  }
  .floor-tabs{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .floor-tabs::-webkit-scrollbar{display:none;}
  .floor-tab{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    color:var(--text-mid);
    font-size:15px; font-weight:600;
    white-space:nowrap;
    outline:none;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .floor-tab.active{
    background:linear-gradient(180deg, rgba(10,132,255,0.9), rgba(10,132,255,0.72));
    color:#fff;
    border-color:rgba(255,255,255,0.25);
    box-shadow:0 4px 18px rgba(10,132,255,0.35);
  }

  .floor-title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; padding:0 4px; gap:12px;
  }
  .floor-title-input{
    font-size:30px; font-weight:750; letter-spacing:-0.02em;
    outline:none; border:none; background:none; color:var(--text-hi);
    width:100%; font-family:inherit; padding:0; margin:0;
  }
  .floor-sub{
    font-size:13px; color:var(--text-lo); font-weight:600; margin-top:2px;
  }

  .settings-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--glass); border:1px solid var(--glass-border);
    color:var(--text-hi); font-size:18px; display:flex;
    align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0; transition:background .15s ease, transform .15s ease;
  }
  .settings-btn:active{
    background:var(--glass-strong); transform:scale(0.95);
  }

  /* ---------- Rooms list ---------- */
  .rooms{ display:flex; flex-direction:column; gap:12px; }

  .room-card{
    border-radius:var(--radius-lg);
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 8px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow:hidden;
    transition:background .2s ease;
  }
  .room-head{
    display:flex; align-items:center; gap:10px;
    padding:17px 18px;
    cursor:pointer;
  }
  .room-name-input{
    flex:1; font-size:18px; font-weight:650; letter-spacing:-0.01em;
    outline:none; background:none; border:none; color:var(--text-hi);
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:inherit; padding:0; margin:0;
  }
  .room-status{
    font-size:14px; font-weight:650; white-space:nowrap;
  }
  .room-status.empty{ color:var(--danger); }
  .room-status.full{ color:var(--ok); }
  .room-status.partial{ color:var(--warn); }
  .chevron{
    color:var(--text-lo); font-size:13px; transition:transform .22s ease;
    width:14px; text-align:center;
  }
  .room-card.open .chevron{ transform:rotate(90deg); }
  .room-del{
    color:var(--text-lo); font-size:16px; padding:4px 6px; cursor:pointer;
  }

  .room-body{
    display:none;
    border-top:1px solid var(--hairline);
  }
  .room-card.open .room-body{ display:block; }

  .person-row{
    display:flex; align-items:center; gap:10px;
    padding:13px 18px;
    border-top:1px solid var(--hairline);
  }
  .person-row:first-child{ border-top:none; }
  .person-name-input{
    flex:1; font-size:16px; font-weight:500; color:var(--text-hi);
    outline:none; background:none; border:none; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:inherit; padding:0; margin:0;
  }
  .chk-wrap{ display:flex; align-items:center; gap:6px; }
  .chk{
    appearance:none; -webkit-appearance:none;
    width:24px; height:24px; border-radius:7px;
    background:rgba(255,255,255,0.85);
    border:1px solid rgba(255,255,255,0.5);
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; flex:0 0 auto;
  }
  .chk.present:checked{ background:var(--accent); border-color:var(--accent); }
  .chk.weekend:checked{ background:var(--warn); border-color:var(--warn); }
  .chk:checked::after{
    content:"✓"; color:#fff; font-size:15px; font-weight:800; line-height:1;
  }
  .person-del{
    color:var(--text-lo); font-size:15px; padding:4px 4px; cursor:pointer;
  }

  .add-row{
    display:flex; align-items:center; gap:8px;
    padding:13px 18px;
    border-top:1px solid var(--hairline);
    color:var(--accent-2); font-size:15px; font-weight:600; cursor:pointer;
  }

  .add-room-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:16px;
    border-radius:var(--radius-lg);
    border:1.5px dashed var(--glass-border);
    color:var(--text-mid);
    font-size:15px; font-weight:650;
    cursor:pointer;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-lo);
  }
  .empty-state .big{ font-size:44px; margin-bottom:10px; }

  /* ---------- Floating report button ---------- */
  .fab-wrap{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(0deg, rgba(8,9,12,0.9), rgba(8,9,12,0.55) 65%, transparent);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .fab{
    width:100%; max-width:610px;
    padding:16px;
    border-radius:20px;
    text-align:center;
    font-size:17px; font-weight:700; letter-spacing:-0.01em;
    color:#fff;
    background:linear-gradient(180deg, rgba(10,132,255,0.92), rgba(10,132,255,0.75));
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 10px 30px rgba(10,132,255,0.38), inset 0 1px 0 rgba(255,255,255,0.25);
    cursor:pointer;
  }
  .fab:active{ transform:scale(0.985); }

  /* ---------- Sheet / modal ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(2px);
    display:none;
    align-items:flex-end;
  }
  .overlay.show{ display:flex; }
  .sheet{
    width:100%; max-width:640px; margin:0 auto;
    background:rgba(22,23,28,0.92);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,0.14);
    border-bottom:none;
    border-radius:28px 28px 0 0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);
    max-height:85vh; overflow-y:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,0.5);
    animation:sheetUp .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes sheetUp{ from{ transform:translateY(30px); opacity:0.5;} to{ transform:translateY(0); opacity:1;} }
  .sheet-handle{
    width:38px; height:5px; border-radius:99px; background:rgba(255,255,255,0.25);
    margin:6px auto 16px;
  }
  .sheet-title{
    font-size:20px; font-weight:750; margin-bottom:16px; text-align:center; color:var(--text-hi);
  }
  .report-card{
    background:rgba(0,0,0,0.35);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
  }
  .report-total{ font-size:19px; font-weight:750; margin-bottom:14px; }
  .report-section-title{
    font-size:13px; font-weight:750; color:var(--text-lo);
    letter-spacing:0.03em; margin-bottom:6px; margin-top:14px;
  }
  .report-section-title:first-of-type{ margin-top:0; }
  .report-line{ font-size:15px; line-height:1.55; color:var(--text-hi); }
  .report-line b{ color:var(--text-mid); font-weight:650; }
  .report-empty{ font-size:15px; color:var(--text-mid); }

  .sheet-section-head{
    font-size:14px; font-weight:700; color:var(--text-mid); margin-bottom:10px;
  }

  .sheet-btn-row{ display:flex; gap:10px; margin-bottom:10px; }
  .sheet-btn{
    flex:1; text-align:center; padding:14px 8px;
    border-radius:16px; font-size:14px; font-weight:650;
    background:var(--glass); border:1px solid var(--glass-border);
    color:var(--text-hi); cursor:pointer;
  }
  .sheet-btn.accent{
    background:rgba(10,132,255,0.18); border-color:rgba(10,132,255,0.4); color:var(--accent-2);
  }
  .sheet-close{
    display:block; width:100%; text-align:center; padding:15px;
    border-radius:16px; font-size:16px; font-weight:700;
    background:linear-gradient(180deg, rgba(10,132,255,0.92), rgba(10,132,255,0.75));
    color:#fff; border:1px solid rgba(255,255,255,0.2); cursor:pointer;
    margin-top:16px; margin-bottom:10px;
  }
  .sheet-reset{
    display:block; width:100%; text-align:center; padding:8px;
    color:var(--danger); font-size:15px; font-weight:600; cursor:pointer;
    background:none; border:none;
  }
  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(10px);
    background:rgba(30,30,34,0.92); border:1px solid var(--glass-border);
    padding:11px 18px; border-radius:14px; font-size:14px; font-weight:600;
    color:var(--text-hi); z-index:80; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    backdrop-filter:blur(14px); text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .json-area{
    width:100%; height:100px; background:rgba(0,0,0,0.5); border:1px solid var(--glass-border);
    border-radius:12px; color:var(--text-hi); padding:10px; font-family:monospace; font-size:12px;
    resize:none; outline:none; margin-bottom:10px;
  }

  .boot{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-mid); font-size:15px; font-weight:600; z-index:100;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
  }
</style>
</head>
<body>

<div id="boot" class="boot">Загрузка…</div>

<div class="app" id="app" style="display:none">

  <div class="topbar">
    <div class="floor-tabs" id="floorTabs"></div>
    <div class="floor-title-row">
      <div style="flex:1">
        <input class="floor-title-input" id="floorTitle" spellcheck="false" enterkeyhint="done">
        <div class="floor-sub" id="floorSub"></div>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Настройки конфигурации">⚙</button>
    </div>
  </div>

  <div class="rooms" id="rooms"></div>

  <div class="add-room-btn" id="addRoomBtn" style="margin-top:12px">＋ Добавить комнату</div>

</div>

<div class="fab-wrap" id="fabWrap" style="display:none">
  <div class="fab" id="reportBtn">Отчёт</div>
</div>

<!-- Модальное окно для отчёта -->
<div class="overlay" id="reportOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="reportContent"></div>
    
    <div class="sheet-btn-row">
      <div class="sheet-btn" id="copyAbsent">Копия отсутств.</div>
      <div class="sheet-btn" id="copyWeekend">Копия выход.</div>
    </div>
    <div class="sheet-btn" id="copyAll" style="margin-bottom:10px;">Скопировать весь отчёт</div>

    <div class="sheet-close" id="closeReportSheet">Закрыть</div>
    <div class="sheet-reset" id="resetAll">Сбросить все отметки присутствия</div>
  </div>
</div>

<!-- Модальное окно для настроек и конфигурации -->
<div class="overlay" id="configOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Конфигурация жильцов</div>
    
    <div class="sheet-section-head">📌 Сохраненный шаблон</div>
    <div class="sheet-btn-row">
      <div class="sheet-btn accent" id="saveTemplate">Сохранить текущий как шаблон</div>
      <div class="sheet-btn" id="loadTemplate">Загрузить шаблон</div>
    </div>

    <div class="sheet-section-head" style="margin-top:16px;">📄 Резервная копия (JSON)</div>
    <div class="sheet-btn-row">
      <div class="sheet-btn" id="exportConfig">Экспорт JSON</div>
      <div class="sheet-btn" id="importConfig">Импорт JSON</div>
    </div>
    
    <div id="jsonAreaWrap" style="display:none; margin-top:10px;">
      <textarea class="json-area" id="jsonInput" placeholder="Вставьте JSON конфигурации здесь..."></textarea>
      <div class="sheet-btn accent" id="applyImport">Применить конфигурацию</div>
    </div>

    <div class="sheet-close" id="closeConfigSheet">Закрыть</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "floor-headcount-state-v2";
  const TEMPLATE_KEY = "floor-headcount-template-v2";
  let state = null;
  let activeFloorId = null;
  let openRoomIds = new Set();

  const uid = () => Math.random().toString(36).slice(2, 10);

  const appStorage = {
    async get(key) {
      try {
        if (typeof window.storage !== 'undefined' && window.storage.get) {
          const res = await window.storage.get(key, false);
          if (res && res.value) return res.value;
        }
      } catch(e) {}
      return localStorage.getItem(key);
    },
    async set(key, val) {
      try {
        if (typeof window.storage !== 'undefined' && window.storage.set) {
          await window.storage.set(key, val, false);
        }
      } catch(e) {}
      try { localStorage.setItem(key, val); } catch(e) {}
    }
  };

  function defaultState(){
    const roomNames = ["534","533","532","531","524","523"];
    const rooms = roomNames.map(n => ({
      id: uid(),
      name: "Комната " + n,
      people: []
    }));
    const floorId = uid();
    return {
      floors: [ { id: floorId, name: "Этаж 5", rooms } ],
      activeFloorId: floorId
    };
  }

  async function load(){
    try{
      const data = await appStorage.get(STORAGE_KEY);
      if(data){
        state = JSON.parse(data);
      } else {
        state = defaultState();
        await persist();
      }
    }catch(e){
      state = defaultState();
    }
    activeFloorId = state.activeFloorId || (state.floors[0] && state.floors[0].id);
  }

  let saveTimer = null;
  function persist(){
    return new Promise((resolve) => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try{
          state.activeFloorId = activeFloorId;
          await appStorage.set(STORAGE_KEY, JSON.stringify(state));
        }catch(e){ /* best effort */ }
        resolve();
      }, 100);
    });
  }

  function getFloor(){
    return state.floors.find(f => f.id === activeFloorId) || state.floors[0];
  }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function copyText(text, okMsg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => showToast(okMsg)).catch(() => fallbackCopy(text, okMsg));
    } else {
      fallbackCopy(text, okMsg);
    }
  }
  function fallbackCopy(text, okMsg){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); showToast(okMsg); }catch(e){ showToast("Не удалось скопировать"); }
    document.body.removeChild(ta);
  }

  // ---------- Rendering ----------

  function render(){
    renderFloorTabs();
    renderFloorHeader();
    renderRooms();
    document.getElementById("fabWrap").style.display = state.floors.length ? "flex" : "none";
  }

  function renderFloorTabs(){
    const wrap = document.getElementById("floorTabs");
    wrap.innerHTML = "";
    state.floors.forEach(f => {
      const el = document.createElement("div");
      el.className = "floor-tab" + (f.id === activeFloorId ? " active" : "");
      el.textContent = f.name;
      el.onclick = () => { activeFloorId = f.id; openRoomIds.clear(); persist(); render(); };
      wrap.appendChild(el);
    });
  }

  function renderFloorHeader(){
    const floor = getFloor();
    const titleEl = document.getElementById("floorTitle");
    const subEl = document.getElementById("floorSub");
    if(!floor){
      titleEl.value = "Нет этажей";
      subEl.textContent = "";
      return;
    }
    if(titleEl.value !== floor.name) titleEl.value = floor.name;
    const total = floor.rooms.reduce((s,r) => s + r.people.length, 0);
    const roomCount = floor.rooms.length;
    subEl.textContent = roomCount + (roomCount === 1 ? " комната" : (roomCount>=2&&roomCount<=4 ? " комнаты":" комнат")) + " · " + total + " чел.";

    titleEl.onchange = () => {
      const val = titleEl.value.trim() || "Этаж";
      floor.name = val;
      titleEl.value = val;
      persist(); renderFloorTabs();
    };
    titleEl.onkeydown = (e) => { if(e.key === "Enter"){ titleEl.blur(); } };
  }

  function roomStatus(room){
    if(room.people.length === 0) return { cls: "empty", text: "Пусто" };
    const absent = room.people.filter(p => !p.present).length;
    if(absent === 0) return { cls: "full", text: room.people.length + " на месте" };
    return { cls: "partial", text: absent + " отсутств." };
  }

  function renderRooms(){
    const wrap = document.getElementById("rooms");
    wrap.innerHTML = "";
    const floor = getFloor();
    if(!floor || floor.rooms.length === 0){
      const es = document.createElement("div");
      es.className = "empty-state";
      es.innerHTML = '<div class="big">🏢</div>Комнат пока нет.<br>Добавьте первую ниже.';
      wrap.appendChild(es);
      return;
    }

    floor.rooms.forEach(room => {
      const card = document.createElement("div");
      card.className = "room-card" + (openRoomIds.has(room.id) ? " open" : "");

      const head = document.createElement("div");
      head.className = "room-head";

      const chevron = document.createElement("div");
      chevron.className = "chevron";
      chevron.textContent = "›";

      const nameEl = document.createElement("input");
      nameEl.className = "room-name-input";
      nameEl.spellcheck = false;
      nameEl.setAttribute("enterkeyhint", "done");
      nameEl.value = room.name;
      nameEl.onclick = (e) => e.stopPropagation();
      nameEl.onchange = () => {
        room.name = nameEl.value.trim() || "Комната";
        nameEl.value = room.name;
        persist(); renderFloorHeader();
      };
      nameEl.onkeydown = (e) => { if(e.key === "Enter"){ nameEl.blur(); } };

      const status = roomStatus(room);
      const statusEl = document.createElement("div");
      statusEl.className = "room-status " + status.cls;
      statusEl.textContent = status.text;

      const delEl = document.createElement("div");
      delEl.className = "room-del";
      delEl.textContent = "✕";
      delEl.onclick = (e) => {
        e.stopPropagation();
        if(confirm('Удалить "' + room.name + '"?')){
          floor.rooms = floor.rooms.filter(r => r.id !== room.id);
          persist(); render();
        }
      };

      head.appendChild(chevron);
      head.appendChild(nameEl);
      head.appendChild(statusEl);
      head.appendChild(delEl);
      head.onclick = () => {
        if(openRoomIds.has(room.id)) openRoomIds.delete(room.id);
        else openRoomIds.add(room.id);
        render();
      };

      const body = document.createElement("div");
      body.className = "room-body";

      room.people.forEach(person => {
        body.appendChild(renderPersonRow(room, person));
      });

      const addRow = document.createElement("div");
      addRow.className = "add-row";
      addRow.textContent = "＋ Добавить человека";
      addRow.onclick = (e) => {
        e.stopPropagation();
        const p = { id: uid(), name: "Новый человек", present: true, weekend: false };
        room.people.push(p);
        openRoomIds.add(room.id);
        persist(); render();
        setTimeout(() => {
          const el = document.querySelector('[data-person-id="' + p.id + '"]');
          if(el) el.select();
        }, 30);
      };
      body.appendChild(addRow);

      card.appendChild(head);
      card.appendChild(body);
      wrap.appendChild(card);
    });
  }

  function renderPersonRow(room, person){
    const row = document.createElement("div");
    row.className = "person-row";

    const nameEl = document.createElement("input");
    nameEl.className = "person-name-input";
    nameEl.spellcheck = false;
    nameEl.setAttribute("enterkeyhint", "done");
    nameEl.value = person.name;
    nameEl.setAttribute("data-person-id", person.id);
    nameEl.onclick = (e) => e.stopPropagation();
    nameEl.onchange = () => {
      person.name = nameEl.value.trim() || "Без имени";
      nameEl.value = person.name;
      persist();
    };
    nameEl.onkeydown = (e) => { if(e.key === "Enter"){ nameEl.blur(); } };

    const presentWrap = document.createElement("label");
    presentWrap.className = "chk-wrap";
    presentWrap.onclick = (e) => e.stopPropagation();
    const presentChk = document.createElement("input");
    presentChk.type = "checkbox";
    presentChk.className = "chk present";
    presentChk.checked = person.present;
    presentChk.onchange = () => {
      person.present = presentChk.checked;
      persist(); renderRooms();
    };
    presentWrap.appendChild(presentChk);

    const weekendWrap = document.createElement("label");
    weekendWrap.className = "chk-wrap";
    weekendWrap.onclick = (e) => e.stopPropagation();
    const weekendChk = document.createElement("input");
    weekendChk.type = "checkbox";
    weekendChk.className = "chk weekend";
    weekendChk.checked = person.weekend;
    weekendChk.onchange = () => {
      person.weekend = weekendChk.checked;
      persist();
    };
    weekendWrap.appendChild(weekendChk);

    const delEl = document.createElement("div");
    delEl.className = "person-del";
    delEl.textContent = "✕";
    delEl.onclick = (e) => {
      e.stopPropagation();
      room.people = room.people.filter(p => p.id !== person.id);
      persist(); render();
    };

    row.appendChild(nameEl);
    row.appendChild(presentWrap);
    row.appendChild(weekendWrap);
    row.appendChild(delEl);
    return row;
  }

  // ---------- Report ----------

  function buildReport(){
    const floor = getFloor();
    const total = floor.rooms.reduce((s,r) => s + r.people.length, 0);
    const absentByRoom = [];
    const weekendByRoom = [];
    floor.rooms.forEach(r => {
      const absent = r.people.filter(p => !p.present).map(p => p.name);
      const weekend = r.people.filter(p => p.weekend).map(p => p.name);
      if(absent.length) absentByRoom.push({ room: r.name, names: absent });
      if(weekend.length) weekendByRoom.push({ room: r.name, names: weekend });
    });
    return { floorName: floor.name, total, absentByRoom, weekendByRoom };
  }

  function reportToText(r){
    let lines = [];
    lines.push(r.floorName.toUpperCase());
    lines.push("ИТОГ: " + r.total + " чел.");
    lines.push("");
    lines.push("ОТСУТСТВУЮТ:");
    if(r.absentByRoom.length === 0){ lines.push("Нет"); }
    else r.absentByRoom.forEach(g => lines.push(g.room + ": " + g.names.join(", ")));
    lines.push("");
    lines.push("ВЫХОДНЫЕ:");
    if(r.weekendByRoom.length === 0){ lines.push("Нет"); }
    else r.weekendByRoom.forEach(g => lines.push(g.room + ": " + g.names.join(", ")));
    return lines.join("\n");
  }
  function groupsToText(groups){
    if(groups.length === 0) return "Нет";
    return groups.map(g => g.room + ": " + g.names.join(", ")).join("\n");
  }

  function openReport(){
    const r = buildReport();
    const el = document.getElementById("reportContent");
    let html = '<div class="report-card">';
    html += '<div class="report-total">ИТОГ: ' + r.total + ' чел.</div>';
    html += '<div class="report-section-title">ОТСУТСТВУЮТ</div>';
    html += r.absentByRoom.length === 0
      ? '<div class="report-empty">Нет</div>'
      : r.absentByRoom.map(g => '<div class="report-line"><b>' + escapeHtml(g.room) + ':</b> ' + escapeHtml(g.names.join(", ")) + '</div>').join("");
    html += '<div class="report-section-title">ВЫХОДНЫЕ</div>';
    html += r.weekendByRoom.length === 0
      ? '<div class="report-empty">Нет</div>'
      : r.weekendByRoom.map(g => '<div class="report-line"><b>' + escapeHtml(g.room) + ':</b> ' + escapeHtml(g.names.join(", ")) + '</div>').join("");
    html += '</div>';
    el.innerHTML = html;

    document.getElementById("reportOverlay").classList.add("show");

    document.getElementById("copyAbsent").onclick = () => copyText(groupsToText(r.absentByRoom), "Список отсутствующих скопирован");
    document.getElementById("copyWeekend").onclick = () => copyText(groupsToText(r.weekendByRoom), "Список выходных скопирован");
    document.getElementById("copyAll").onclick = () => copyText(reportToText(r), "Отчёт скопирован");
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function closeReport(){
    document.getElementById("reportOverlay").classList.remove("show");
  }

  // ---------- Config Handlers ----------

  function openConfig(){
    document.getElementById("jsonAreaWrap").style.display = "none";
    document.getElementById("configOverlay").classList.add("show");
  }

  function closeConfig(){
    document.getElementById("configOverlay").classList.remove("show");
  }

  async function saveAsTemplate(){
    try {
      await appStorage.set(TEMPLATE_KEY, JSON.stringify(state));
      showToast("Конфигурация сохранена как шаблон!");
    } catch(e) {
      showToast("Ошибка при сохранении шаблона");
    }
  }

  async function loadFromTemplate(){
    try {
      const data = await appStorage.get(TEMPLATE_KEY);
      if(!data){
        showToast("Сохраненный шаблон не найден");
        return;
      }
      if(confirm("Загрузить сохраненную конфигурацию? Текущие отметки будут сброшены к шаблону.")){
        state = JSON.parse(data);
        activeFloorId = state.activeFloorId || state.floors[0].id;
        await persist();
        render();
        closeConfig();
        showToast("Шаблон успешно загружен");
      }
    } catch(e) {
      showToast("Ошибка при загрузке шаблона");
    }
  }

  function exportConfigText(){
    const wrap = document.getElementById("jsonAreaWrap");
    const textarea = document.getElementById("jsonInput");
    const json = JSON.stringify(state, null, 2);
    textarea.value = json;
    wrap.style.display = "block";
    copyText(json, "Конфигурация скопирована в буфер обмена");
  }

  function importConfigText(){
    const wrap = document.getElementById("jsonAreaWrap");
    const textarea = document.getElementById("jsonInput");
    textarea.value = "";
    wrap.style.display = "block";
    textarea.focus();
    showToast("Вставьте JSON в поле ниже и нажмите 'Применить'");
  }

  async function applyImportedConfig(){
    const textarea = document.getElementById("jsonInput");
    try {
      const parsed = JSON.parse(textarea.value.trim());
      if(parsed && Array.isArray(parsed.floors)){
        state = parsed;
        activeFloorId = state.activeFloorId || state.floors[0].id;
        await persist();
        render();
        closeConfig();
        showToast("Новая конфигурация успешно применена!");
      } else {
        showToast("Некорректный формат JSON");
      }
    } catch(e) {
      showToast("Ошибка чтения JSON кода");
    }
  }

  // ---------- Init ----------

  async function init(){
    await load();
    document.getElementById("boot").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();

    document.getElementById("addRoomBtn").onclick = () => {
      const floor = getFloor();
      const r = { id: uid(), name: "Новая комната", people: [] };
      floor.rooms.push(r);
      persist(); render();
      setTimeout(() => {
        const cards = document.querySelectorAll(".room-name-input");
        const last = cards[cards.length - 1];
        if(last) last.select();
      }, 30);
    };

    // Events for Report
    document.getElementById("reportBtn").onclick = openReport;
    document.getElementById("closeReportSheet").onclick = closeReport;
    document.getElementById("reportOverlay").onclick = (e) => {
      if(e.target.id === "reportOverlay") closeReport();
    };
    document.getElementById("resetAll").onclick = () => {
      if(confirm("Сбросить все отметки на этаже к значению по умолчанию (все на месте, никто не на выходных)?")){
        const floor = getFloor();
        floor.rooms.forEach(r => r.people.forEach(p => { p.present = true; p.weekend = false; }));
        persist(); closeReport(); render();
        showToast("Отметки сброшены");
      }
    };

    // Events for Settings / Config
    document.getElementById("settingsBtn").onclick = openConfig;
    document.getElementById("closeConfigSheet").onclick = closeConfig;
    document.getElementById("configOverlay").onclick = (e) => {
      if(e.target.id === "configOverlay") closeConfig();
    };
    document.getElementById("saveTemplate").onclick = saveAsTemplate;
    document.getElementById("loadTemplate").onclick = loadFromTemplate;
    document.getElementById("exportConfig").onclick = exportConfigText;
    document.getElementById("importConfig").onclick = importConfigText;
    document.getElementById("applyImport").onclick = applyImportedConfig;
  }

  init();
})();
</script>
</body>
</html>
