<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Этаж 5</title>
  <style>
    /* 1. Настройка фона всего экрана для предотвращения белых полос */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b10; /* Тёмный фон всего приложения */
      color: #ffffff;
      /* Отключает резиновый отскок прокрутки, из-за которого виден белый фон */
      overscroll-behavior-y: none; 
      overflow: hidden;
    }

    /* Главный контейнер */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: env(safe-area-inset-top, 20px);
      position: relative;
    }

    /* Шапка */
    .header {
      padding: 16px 20px 8px 20px;
    }

    .badge {
      display: inline-block;
      background-color: #007aff;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #8e8e93;
    }

    /* 2. Область прокрутки комнат */
    .rooms-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px 90px 20px; /* Нижний отступ 90px, чтобы кнопка не перекрывала элементы */
      -webkit-overflow-scrolling: touch;
    }

    /* Карточка комнаты */
    .room-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    .room-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chevron {
      color: #8e8e93;
      font-size: 12px;
    }

    .room-name {
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      color: #ff3b30;
      font-size: 14px;
      font-weight: 500;
    }

    /* 3. Фиксированная кнопка снизу */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 10px)) 20px;
      background: linear-gradient(to top, rgba(11, 11, 16, 1) 70%, rgba(11, 11, 16, 0));
    }

    .report-btn {
      width: 100%;
      height: 50px;
      background-color: #007aff;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .report-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Шапка -->
    <div class="header">
      <div class="badge">Этаж 5</div>
      <h1 class="title">Этаж 5</h1>
      <p class="subtitle" id="rooms-count">12 комнат · 0 чел.</p>
    </div>

    <!-- Список комнат -->
    <div class="rooms-list" id="rooms-container">
      <!-- Элементы рендерятся через JS -->
    </div>

    <!-- Фиксированная кнопка "Отчёт" -->
    <div class="bottom-bar">
      <button class="report-btn">Отчёт</button>
    </div>
  </div>

  <script>
    // 4. Фиксированный массив комнат (без возможности добавления)
    const rooms = ["534", "533", "532", "531", "524", "523", "522", "521", "514", "513", "512", "511"];

    const container = document.getElementById('rooms-container');
    const countElement = document.getElementById('rooms-count');

    // Обновляем счётчик
    countElement.textContent = `${rooms.length} комнат · 0 чел.`;

    // Рендерим список
    rooms.forEach(roomNumber => {
      const roomCard = document.createElement('div');
      roomCard.className = 'room-card';
      roomCard.innerHTML = `
        <div class="room-info">
          <span class="chevron">❯</span>
          <span class="room-name">Комната ${roomNumber}</span>
        </div>
        <span class="status">Пусто</span>
      `;
      container.appendChild(roomCard);
    });
  </script>

</body>
</html>
